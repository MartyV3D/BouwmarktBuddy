<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BouwmarktBuddy · Import cluster 0335</title>
<script>
  /* Maakt laad-/scriptfouten zichtbaar i.p.v. stilletjes falen */
  window.addEventListener('error', function(e){
    var d = (e.message||'?') + '  ['+(e.filename||'?')+':'+(e.lineno||'?')+']';
    console.error('[IMPORT FOUT]', d, e.error||'');
    showErr('FOUT: ' + d);
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; var m = (r && r.message) ? r.message : String(r);
    console.error('[IMPORT PROMISE-FOUT]', r);
    showErr('PROMISE-FOUT: ' + m);
  });
  function showErr(txt){
    var box = document.getElementById('err');
    if(!box){
      box = document.createElement('pre');
      box.id='err';
      box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;margin:0;padding:10px 12px;background:#b00020;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto;';
      (document.body||document.documentElement).appendChild(box);
    }
    box.textContent = txt + (box.textContent ? '\n\n'+box.textContent : '');
  }
</script>
<style>
  .status{margin:12px 0 0;font-size:13px;color:#888780}
  .status.ok{color:#0f6e56;font-weight:500}
  .status.busy{color:#9a6a00;font-weight:500}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f5f3ee;color:#1a1a18;padding:24px 16px 64px;display:flex;justify-content:center}
  .card{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:680px;box-shadow:0 2px 24px rgba(0,0,0,.07)}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .sub{color:#888780;font-size:14px;margin-bottom:20px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{background:#e1f5ee;border:1px solid #9fe1cb;color:#085041;font-size:13px;padding:5px 11px;border-radius:20px;font-weight:500}
  .chip.warn{background:#faeeda;border-color:#fac775;color:#633806}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:#1d9e75;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .bar{height:10px;background:#e8e6e0;border-radius:6px;overflow:hidden;margin:18px 0 8px;display:none}
  .bar>div{height:100%;width:0;background:#1d9e75;transition:width .15s}
  .counts{display:flex;gap:16px;font-size:13px;color:#888780;margin-bottom:12px}
  .counts b{color:#1a1a18}
  .log{margin-top:14px;max-height:340px;overflow:auto;border:1px solid #e8e6e0;border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;background:#faf9f6;display:none;white-space:pre-wrap}
  .log .add{color:#0f6e56}
  .log .upd{color:#9a6a00}
  .log .err{color:#b00020}
  .done{margin-top:14px;padding:12px;border-radius:10px;background:#e1f5ee;border:1px solid #9fe1cb;color:#085041;font-weight:500;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Producten importeren</h1>
  <div class="sub">BouwmarktBuddy &middot; databank-import</div>
  <div class="meta">
    <span class="chip">Cluster 0335</span>
    <span class="chip">Pad 39</span>
    <span class="chip" id="aantal-chip">0 producten</span>
    <span class="chip warn">Bestaande worden overschreven</span>
  </div>

  <button id="start">Start import</button>
  <div class="status" id="status">⏳ Script wordt geladen…</div>

  <div class="bar" id="bar"><div id="barfill"></div></div>
  <div class="counts">
    <span>Verwerkt: <b id="c-done">0</b></span>
    <span>Toegevoegd: <b id="c-add">0</b></span>
    <span>Overschreven: <b id="c-upd">0</b></span>
    <span>Fouten: <b id="c-err">0</b></span>
  </div>
  <div class="done" id="done"></div>
  <div class="log" id="log"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyByXEZVX6bDpEqvPrUflzMzQ6rJ8ZF1wgY",
  authDomain: "bouwmarktbuddy-82e1c.firebaseapp.com",
  projectId: "bouwmarktbuddy-82e1c",
  storageBucket: "bouwmarktbuddy-82e1c.firebasestorage.app",
  messagingSenderId: "489636021675",
  appId: "1:489636021675:web:1b42ed107a407d033abeee"
};

const statusEl = document.getElementById('status');
function setStatus(txt, cls){ statusEl.textContent = txt; statusEl.className = 'status' + (cls ? ' '+cls : ''); }

setStatus('⏳ Verbinden met Firebase…', 'busy');
let app, db;
try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} catch(e){
  setStatus('⛔ Firebase-init mislukt: ' + (e && e.message ? e.message : e), '');
  throw e;
}

const PRODUCTEN = [
  {
    "volgnummer": 101,
    "px": "5643989",
    "naam": "Cetabever Tuinmeubelolie zijdeglans blank",
    "ean": "8711113126984",
    "cluster": "0335",
    "pad": "39"
  }
];

document.getElementById('aantal-chip').textContent = PRODUCTEN.length + ' producten';

const $ = id => document.getElementById(id);
let cDone=0, cAdd=0, cUpd=0, cErr=0;

function logLine(cls, txt){
  const log = $('log');
  const span = document.createElement('div');
  if(cls) span.className = cls;
  span.textContent = txt;
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}
function refresh(){
  $('c-done').textContent=cDone; $('c-add').textContent=cAdd;
  $('c-upd').textContent=cUpd; $('c-err').textContent=cErr;
  $('barfill').style.width = (cDone/PRODUCTEN.length*100).toFixed(1)+'%';
}

async function vindBestaand(p){
  // 1) match op EAN
  let snap = await getDocs(query(collection(db,'producten'), where('ean','==', p.ean)));
  if(!snap.empty) return snap.docs[0].id;
  // 2) anders match op px
  snap = await getDocs(query(collection(db,'producten'), where('px','==', p.px)));
  if(!snap.empty) return snap.docs[0].id;
  return null;
}

async function importeer(){
  $('start').disabled = true;
  $('bar').style.display='block';
  $('log').style.display='block';
  setStatus('⏳ Import bezig…', 'busy');
  logLine('', '▶ Import gestart — ' + PRODUCTEN.length + ' producten…');
  for(const p of PRODUCTEN){
    try{
      const bestaandId = await vindBestaand(p);
      if(bestaandId){
        await setDoc(doc(db,'producten', bestaandId), p); // volledige overschrijving
        cUpd++; logLine('upd', '✏️  overschreven  #'+p.volgnummer+'  '+p.naam+'  ('+p.ean+')');
      } else {
        await addDoc(collection(db,'producten'), p);
        cAdd++; logLine('add', '➕  toegevoegd   #'+p.volgnummer+'  '+p.naam+'  ('+p.ean+')');
      }
    }catch(e){
      cErr++; logLine('err', '⛔  FOUT #'+p.volgnummer+'  '+p.naam+'  →  '+(e && e.message ? e.message : e));
    }
    cDone++; refresh();
  }
  const d = $('done');
  d.style.display='block';
  d.textContent = '✅ Klaar — '+cAdd+' toegevoegd, '+cUpd+' overschreven'+(cErr? ', '+cErr+' fouten (zie log)':'')+'.';
  setStatus(cErr ? '⚠️ Klaar met '+cErr+' fouten — zie log' : '✅ Import voltooid', cErr ? 'busy' : 'ok');
}

$('start').addEventListener('click', importeer);
setStatus('✅ Klaar om te starten — klik op “Start import”', 'ok');
console.log('Import-module geladen, ' + PRODUCTEN.length + ' producten klaar.');
</script>
</body>
</html>
